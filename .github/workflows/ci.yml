name: Build and Test

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print secret length
        run: |
          secret="${{ secrets.MY_SECRET }}"
          echo "Secret length: ${#secret}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: mvn dependency:resolve

      - name: Compile
        run: mvn compile

      - name: Run tests
        run: mvn test

      - name: Upload artifact (JAR file)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 30
