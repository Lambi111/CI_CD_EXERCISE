name: Build and Test

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print secret length
        run: |
          secret="${{ secrets.MY_SECRET }}"
          echo "Secret length: ${#secret}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: mvn dependency:resolve

      - name: Compile
        run: mvn compile

      - name: Run tests
        run: mvn test

      - name: Build JAR with Maven
        run: mvn -B package

      - name: Upload artifact (JAR file)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 30

      - name: Set Git SHA
        id: git
        run: echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/lambi111/ci_cd_exercise/myapp:latest .
          docker tag ghcr.io/lambi111/ci_cd_exercise/myapp:latest ghcr.io/lambi111/ci_cd_exercise/myapp:${GIT_SHA}

      - name: Push Docker image
        run: |
          docker push ghcr.io/lambi111/ci_cd_exercise/myapp:latest
          docker push ghcr.io/lambi111/ci_cd_exercise/myapp:${GIT_SHA}
