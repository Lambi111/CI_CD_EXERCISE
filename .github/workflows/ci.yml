name: Build and Test

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Print secret length
        run: echo "Secret length ${{ secrets.API_KEY }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: mvn dependency:resolve

      - name: Compile
        run: mvn compile

      - name: Run tests
        run: mvn test
